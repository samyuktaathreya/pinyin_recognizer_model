[project]
name = "pinyin-phoneme"
version = "0.1.0"
description = "Small model that scores the initial and final of a spoken pinyin syllable"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "soundfile",
    "pyyaml",
    "onnx",
    "onnxscript",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
